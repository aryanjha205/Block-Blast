<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Block Blast</title>
    <meta name="description" content="Drag and drop colorful blocks to fill rows and columns. Clear lines, build combos, beat your high score!" />
    <meta name="theme-color" content="#00c853" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Block Blast" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta property="og:title" content="Block Blast — Puzzle Game" />
    <meta property="og:description" content="Drag and drop colorful blocks, clear lines, build combos!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-CRL-UDEu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BGPtjqHb.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>

    <!-- HUD Bar -->
    <header class="hud">
      <div class="hud-logo">
        <span class="hud-cube"><i></i></span>
        <span class="hud-name">Block<b>Blast</b></span>
      </div>

      <div class="hud-stats">
        <div class="hud-stat" id="score-card">
          <span class="hud-stat-label">SCORE</span>
          <input type="text" readonly id="score" value="0" />
        </div>
        <div class="hud-sep"></div>
        <div class="hud-stat" id="combo-card">
          <span class="hud-stat-label">COMBO</span>
          <input type="text" readonly id="combo" value="0" />
        </div>
        <div class="hud-sep"></div>
        <div class="hud-stat" id="best-card">
          <span class="hud-stat-label">BEST</span>
          <input type="text" readonly id="bestScore" value="0" />
        </div>
      </div>
      <div class="settings-wrap">
        <button class="settings-button" id="settingsButton" type="button" aria-label="Game settings" aria-expanded="false">⚙️</button>
        <div class="settings-menu" id="settingsMenu" hidden>
          <button type="button" id="settingsHelp">How to play</button>
          <button type="button" id="settingsReset">New game</button>
        </div>
      </div>
    </header>

    <!-- Game Canvas — fills everything below HUD -->
    <main class="game-wrap">
      <canvas id="gameCanvas" width="600" height="850" aria-label="Block Blast game board"></canvas>
    </main>

  </body>
</html>
