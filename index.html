<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Block Blast — Puzzle Game</title>
    <meta name="description" content="Drag and drop colorful blocks to fill rows and columns. Clear lines, build combos, and beat your high score in Block Blast!" />
    <meta name="keywords" content="block blast, puzzle game, blocks, tetris, browser game" />
    <meta name="author" content="Block Blast" />

    <!-- PWA -->
    <meta name="theme-color" content="#00c853" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Block Blast" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Block Blast — Puzzle Game" />
    <meta property="og:description" content="Drag and drop colorful blocks to fill rows and columns. Clear lines, build combos, and beat your high score!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Block Blast — Puzzle Game" />
    <meta name="twitter:description" content="Drag and drop colorful blocks to fill rows and columns. Clear lines, build combos!" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="game-header">
      <h1 class="game-title">
        <span class="title-block title-b">B</span><span class="title-block title-l">L</span><span class="title-block title-o">O</span><span class="title-block title-c">C</span><span class="title-block title-k">K</span>
        <span class="title-space"> </span>
        <span class="title-block title-bl">B</span><span class="title-block title-la">L</span><span class="title-block title-as">A</span><span class="title-block title-st">S</span><span class="title-block title-t2">T</span>
      </h1>
    </header>

    <main class="game-area">
      <canvas id="gameCanvas" width="600" height="600" aria-label="Block Blast game board"></canvas>

      <aside class="display" aria-label="Game stats">
        <div class="stat-card" id="score-card">
          <span class="stat-label">Score</span>
          <input type="text" readonly id="score" value="0" aria-label="Current score" />
        </div>
        <div class="stat-card combo-card" id="combo-card">
          <span class="stat-label">Combo</span>
          <input type="text" readonly id="combo" value="0" aria-label="Current combo" />
        </div>
        <div class="stat-card" id="best-card">
          <span class="stat-label">Best</span>
          <input type="text" readonly id="bestScore" value="0" aria-label="Best score" />
        </div>
      </aside>
    </main>

    <script type="module" src="./src/script.js"></script>
  </body>
</html>
